<ol class="plotline-steps">
<li><strong>New task → One prompt enough?</strong> Start with the cheapest option. Does one good prompt pass your checks?</li>
<li><strong>One prompt enough? → Steps known?</strong> It does not, so ask whether the steps are known in advance.</li>
<li><strong>Steps known? → Plannable up front?</strong> They are not, so a workflow will not do. Can the whole job be planned before it starts?</li>
<li><strong>Plannable up front? → Agent loop</strong> Each step depends on the last, so use an agent loop.</li>
<li><strong>Agent loop → Wrap with controls</strong> Wrap it in approvals for risky actions, guardrails and context management.</li>
<li><strong>Wrap with controls → Beats simpler option?</strong> Measure it against the simpler option before you believe it.</li>
<li><strong>Beats simpler option? → Ship it</strong> Ship it only if the evals show the extra calls bought something.</li>
</ol>
