        (placed[fl.k] = placed[fl.k] || []).push(best.r);
        if (best.score > 1500) problems.push(`${seg.id} step ${fl.k + 1}: no clear space for the label "${fl.label}" (shorten it or spread the nodes)`);
        return best;
      });
    });

    // layout checks
    for (let i = 0; i < ids.length; i++) {
      const a = nodes[ids[i]];
      if (a.label.getComputedTextLength() > NW - 14) problems.push(`${seg.id}: label "${a.label.textContent}" is too wide for its node`);
      [...new Set(a.subs.map(s => s[1]))].forEach(txt => { a.sub.textContent = txt; if (a.sub.getComputedTextLength() > NW - 10) problems.push(`${seg.id}: sub-line "${txt}" is too wide for node ${a.id}`); });
      a.sub.textContent = a.subs[0][1];
      for (let j = i + 1; j < ids.length; j++) if (overlap(a.box, nodes[ids[j]].box) > 0) problems.push(`${seg.id}: nodes ${a.id} and ${ids[j]} overlap`);
      Object.values(groups).forEach(q => { if (q.box && !q.all.includes(a.id) && overlap(a.box, q.box) > 0) problems.push(`${seg.id}: node ${a.id} sits inside group ${q.id} but is not a member`); });
    }
    Object.values(edges).forEach(e => ids.forEach(i => {
      if (i === e.a || i === e.b) return; const b = nodes[i].box;
      for (let f = 0.04; f < 1; f += 0.04) { const p = pointAt(e.pts, e.len, f); if (p[0] > b.x0 && p[0] < b.x1 && p[1] > b.y0 && p[1] < b.y1) { problems.push(`${seg.id}: the connector ${e.a}–${e.b} passes through node ${i} (move a node, or give the edge a \`via\`)`); break; } }
    }));

    const stepAt = lt => { let k = -1; for (let i = 0; i < steps.length; i++) if (lt >= steps[i].t0) k = i; return k; };
    function update(lt) {
      const k = stepAt(lt), st = k >= 0 ? steps[k] : null, inStep = st && lt < st.t0 + st.dur, c = camAt(lt);
      cam.setAttribute('transform', `translate(${SC.x},${SC.y}) scale(${c.s}) translate(${-c.x},${-c.y})`);
      const prev = k > 0 ? steps[k - 1] : null, next = st && steps[k + 1];
      const du = st ? ez((lt - st.t0) / .45) : 0, out = inStep ? 0 : (st ? ez((lt - st.t0 - st.dur) / .45) : 0);

      // lit amounts from the current step

        (st.highlight || []).forEach(i => lit[i] = ez((lt - st.t0) / .3));
        flows.filter(f => f.k === k).forEach(f => f.path.forEach((id, i) => {
          const at = i === 0 ? st.t0 + .05 : f.ts + invEz(f.fr[i]) * f.T; lit[id] = Math.max(lit[id] || 0, cl((lt - at) / .22));
        }));
        const fade = 1 - cl((lt - (st.t0 + st.dur - .25)) / .25);
        for (const id in lit) if (!(next && next.sources.has(id))) lit[id] *= fade;
      }
      ids.forEach(id => {
        const n = nodes[id], vis = eo((lt - n.appear) / .45);
        const dim = lp(lp(dimOf(prev && prev.actors, id), dimOf(st && st.actors, id), du), 0, out);
        n.g.setAttribute('opacity', vis * lp(1, DIM, dim));
        n.g.setAttribute('transform', vis < 1 ? `translate(0,${(1 - vis) * 16})` : '');
        const L = lit[id] || 0;
        n.rect.setAttribute('stroke', L > .05 ? C.accent : C.border); n.rect.setAttribute('stroke-width', lp(1.5, 2.6, L));
        n.tint.setAttribute('opacity', .09 * L); n.glow.setAttribute('opacity', .2 * L);
        let txt = n.subs[0][1]; for (const [t, v] of n.subs) if (lt >= t) txt = v;
        if (n.sub.textContent !== txt) n.sub.textContent = txt;
        const changed = n.subs.filter(s => s[0] > 0 && lt >= s[0]).pop();
        n.sub.setAttribute('fill', changed && lt - changed[0] < 1.2 ? C.accent : C.muted);
        n.ring.setAttribute('opacity', 0);
      });
      // arrival pulse on the last node of each packet
      if (inStep) flows.filter(f => f.k === k && !f.stream).forEach(f => {
        const n = nodes[f.path[f.path.length - 1]], u = (lt - (f.ts + f.T)) / .7; if (u < 0 || u > 1) return;
        const g = 4 + eo(u) * 20; n.ring.setAttribute('x', n.x - NW / 2 - g); n.ring.setAttribute('y', n.y - NH / 2 - g);
        n.ring.setAttribute('width', NW + 2 * g); n.ring.setAttribute('height', NH + 2 * g); n.ring.setAttribute('rx', 16 + g);
        n.ring.setAttribute('stroke', f.col); n.ring.setAttribute('opacity', .7 * (1 - u));
      });
      Object.values(groups).forEach(q => { if (q.g) q.g.setAttribute('opacity', eo((lt - q.appear) / .5)); });
      // edges
      const hotE = new Map();
      flows.forEach(f => {
        if (k < f.k || k > f.lastStep || lt < f.ts) return;
        const endT = steps[f.lastStep].t0 + steps[f.lastStep].dur, a = cl((lt - f.ts) / .25) * (1 - cl((lt - (endT - .3)) / .3));
        f.hops.forEach((h, i) => { const reached = f.stream ? 1 : cl((lt - (f.ts + invEz(f.fr[i]) * f.T)) / .15); const key = ekey(h.e.a, h.e.b); if (a * reached > (hotE.get(key) || [0])[0]) hotE.set(key, [a * reached, f.col, h.e.a === f.path[i] ? 1 : -1]); });
      });
      for (const key in edges) {
        const e = edges[key], vis = ez((lt - e.appear) / .5), hot = hotE.get(key), onStage = st && inStep && st.actors.size ? (hot ? 0 : 1) : 0;
        if (!e.dashed) { e.base.setAttribute('stroke-dasharray', e.len); e.base.setAttribute('stroke-dashoffset', e.len * (1 - vis)); }
        e.base.setAttribute('opacity', (e.dashed ? vis : 1) * lp(1, .55, onStage * du));
        if (e.lab) e.lab.setAttribute('opacity', vis);
        e.hot.setAttribute('opacity', hot ? hot[0] * .95 : 0);
        if (hot) { e.hot.setAttribute('stroke', hot[1]); e.hot.setAttribute('stroke-dashoffset', (-hot[2] * lt * 46).toFixed(1)); }
      }
      // packets, streams and their labels
      flows.forEach(f => {
        const endT = steps[f.lastStep].t0 + steps[f.lastStep].dur, active = k >= f.k && k <= f.lastStep && lt >= f.ts - .05 && lt < endT;
        if (!active) { f.dots.forEach(d => d.setAttribute('opacity', 0)); if (f.halo) f.halo.setAttribute('opacity', 0); if (f.chip) f.chip.style.opacity = 0; return; }
        const u = ez((lt - f.ts) / f.T), raw = (lt - f.ts) / f.T;
        let hop = 0;
        if (f.stream) {
          const fadeOut = 1 - cl((lt - (endT - .35)) / .35), n = f.dots.length;
          f.dots.forEach((d, i) => {
            const fr = ((i / n) + (lt - f.ts) * speed * .55 / f.len) % 1, pos = flowPos(f, fr);
            d.setAttribute('cx', pos.p[0]); d.setAttribute('cy', pos.p[1]);
            d.setAttribute('opacity', (fr <= u + .001 ? 1 : 0) * fadeOut * cl((lt - f.ts) / .2) * Math.min(1, fr * 12, (1 - fr) * 12));
          });
          hop = flowPos(f, Math.min(u, .999)).hop;
        } else {
          const gone = cl((lt - (f.ts + f.T)) / .35), show = cl((lt - (f.ts - .05)) / .15) * (1 - gone);
          f.dots.forEach((d, i) => {
            const pos = flowPos(f, ez((lt - f.ts - i * .032) / f.T));
            d.setAttribute('cx', pos.p[0]); d.setAttribute('cy', pos.p[1]);
            d.setAttribute('opacity', (i === 0 ? 1 : raw < 1 ? .3 - i * .04 : 0) * show);
          });
          const head = flowPos(f, u); hop = head.hop;
          f.halo.setAttribute('cx', head.p[0]); f.halo.setAttribute('cy', head.p[1]); f.halo.setAttribute('opacity', .22 * show);
        }
        if (f.chip) {
          const tHop = f.ts + invEz(f.fr[hop]) * f.T, b = ez((lt - tHop) / .3), p1 = f.place[hop], p0 = hop ? f.place[hop - 1] : p1;
          const anchor = (pl, hi) => { const sp = toScreen(pointAt(f.hops[hi].pts, f.hops[hi].e.len, pl.f), c); return [sp[0] + pl.nx * pl.dist, sp[1] + pl.ny * pl.dist]; };
          const A = anchor(p0, hop ? hop - 1 : hop), B = anchor(p1, hop), x = lp(A[0], B[0], b), y = lp(A[1], B[1], b);
          const end = f.st.t0 + f.st.dur;   // a stream keeps flowing, but its label leaves with its step
          f.chip.style.opacity = cl((lt - f.ts + .1) / .2) * (1 - cl((lt - (end - .3)) / .3));
          f.chip.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%)`;
        }
      });
      badges.forEach(b => { b.g.setAttribute('opacity', cl((lt - b.from) / .25) * (1 - cl((lt - b.to + .3) / .3))); });
      // header
      hTitle.textContent = seg.title || S.title || '';
      const cap = st && inStep ? (st.caption || '') : '';
      hSub.innerHTML = ''; if (st && inStep && steps.length) { ht('b', '', hSub, `${k + 1} / ${steps.length}`); hSub.appendChild(document.createTextNode(cap)); } else if (seg.subtitle) hSub.textContent = seg.subtitle;
    }
    return { seg, box, update, stepTimes: steps.map(s => seg.t0 + s.t0) };
  }

  // ── timeline ───────────────────────────────────────────────────────────────
  function init() {
  const parts = S.segments.map(seg => seg.kind === 'diagram' ? buildDiagram(seg) : buildCard(seg));
  window.renderAt = function (t) {
    t = cl(t, 0, S.total);
    let diagram = false;
    parts.forEach((p, i) => {
      const s = p.seg, lt = t - s.t0, on = lt >= 0 && (lt < s.dur || i === parts.length - 1);
      p.box.style.display = on ? '' : 'none'; if (!on) return;
      const last = i === parts.length - 1;
      p.box.style.opacity = ez(lt / .45) * (last ? 1 : 1 - ez((lt - (s.dur - .35)) / .35));
      p.update(lt); if (s.kind === 'diagram') { diagram = true; header.style.opacity = p.box.style.opacity; }
    });
    header.style.display = diagram ? '' : 'none';
    const cue = S.cues.find(q => t >= q.t && t < q.t + q.dur + .12);
    capSpan.textContent = cue ? cue.text : ''; caption.style.opacity = cue ? cl((t - cue.t) / .12 + .4) : 0; capSpan.style.display = cue ? '' : 'none';
    bar.style.width = (t / S.total * W) + 'px';
  };
  window.lint = function () {
    const out = problems.slice(); capSpan.style.display = '';
    S.cues.forEach(q => { capSpan.textContent = q.text; if (capSpan.offsetHeight > 92) out.push(`caption too long for the screen: "${q.text.slice(0, 50)}…"`); });
    return [...new Set(out)];
  };
  window.TOTAL = S.total;

  // ── interactive mode (the web export) ──────────────────────────────────────
  if (S.mode !== 'render') {
    const fitBox = document.getElementById('fit'), ctr = document.getElementById('controls');
    const resize = () => { const k = fitBox.clientWidth / W; stage.style.transform = `scale(${k})`; fitBox.style.height = (H * k) + 'px'; };
    window.addEventListener('resize', resize); resize();
    const marks = [...new Set([0, ...S.segments.map(s => s.t0), ...parts.flatMap(p => p.stepTimes || [])])].sort((a, b) => a - b);
    const audio = S.audio ? new Audio(S.audio) : null;
    let t = 0, playing = false, last = 0;
    const bPrev = ht('button', '', ctr, '◀ Step'), bPlay = ht('button', '', ctr, 'Play'), bNext = ht('button', '', ctr, 'Step ▶');
    const scrub = ht('input', '', ctr); scrub.type = 'range'; scrub.min = 0; scrub.max = S.total; scrub.step = 0.01; scrub.value = 0;
    const time = ht('span', 'time', ctr);
    const fmt = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
    const show = () => { window.renderAt(t); scrub.value = t; time.textContent = fmt(t) + ' / ' + fmt(S.total); bPlay.textContent = playing ? 'Pause' : 'Play'; };
    const seek = x => { t = cl(x, 0, S.total); if (audio) audio.currentTime = t; show(); };
    const setPlay = v => { playing = v; last = performance.now(); if (audio) { if (v) audio.play().catch(() => {}); else audio.pause(); } if (v) requestAnimationFrame(tick); show(); };
    function tick(now) {
      if (!playing) return;
      t = audio && !audio.paused ? audio.currentTime : t + (now - last) / 1000; last = now;
      if (t >= S.total) { t = S.total; setPlay(false); return; }
      show(); requestAnimationFrame(tick);
    }
    bPlay.onclick = () => { if (t >= S.total - .05) seek(0); setPlay(!playing); };
    bNext.onclick = () => { setPlay(false); seek((marks.find(m => m > t + .05) ?? S.total) + .001); };
    bPrev.onclick = () => { setPlay(false); seek(([...marks].reverse().find(m => m < t - .3) ?? 0) + .001); };
    scrub.oninput = () => { seek(parseFloat(scrub.value)); };
    stage.onclick = () => bPlay.onclick();
    show();
  }
  window.renderAt(0);
  window.READY = true;
  }
  const faces = (TH.font_faces || []).map(f => document.fonts.load(`${String(f.weight || 400).split(' ')[0]} 20px "${f.family}"`).catch(() => {}));
  Promise.all([document.fonts.ready, ...faces]).then(init);
})();
